name: Generate Complete Sitemap v1

on:
  workflow_dispatch:
    inputs:
      expected_base_sha:
        description: Exact branch SHA reviewed before dispatch
        required: true
        type: string
      base_url:
        description: HTTPS origin; blank uses tracked CNAME or repository name
        required: false
        default: ""
        type: string
      minimum_urls:
        description: Minimum tracked HTML URLs required before generation
        required: false
        default: "1"
        type: string
      commit_message:
        description: Commit message for an actual verified change
        required: false
        default: Generate complete sitemap
        type: string

permissions:
  contents: read

concurrency:
  group: complete-sitemap-generation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify dispatch binding
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "The workflow must be dispatched against a branch." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_base_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "The dispatched branch moved after review; refusing to generate from stale bytes." >&2
            exit 1
          fi

      - name: Check out the reviewed branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run generator regression tests
        run: python .github/scripts/test_complete_sitemap_generator.py

      - name: Generate complete sitemap
        id: generate
        shell: bash
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          INPUT_MINIMUM_URLS: ${{ inputs.minimum_urls }}
          GENERATED_PATHS_FILE: ${{ runner.temp }}/generated-complete-sitemap-paths.nul
          GENERATION_SUMMARY_FILE: ${{ runner.temp }}/complete-sitemap-generation-summary.json
        run: |
          set -euo pipefail
          python .github/scripts/complete_sitemap_generator.py generate \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "$INPUT_BASE_URL" \
            --minimum-urls "$INPUT_MINIMUM_URLS" \
            --paths-file "$GENERATED_PATHS_FILE" \
            --summary-file "$GENERATION_SUMMARY_FILE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify exact unstaged boundary
        if: steps.generate.outputs.changed == 'true'
        env:
          GENERATED_PATHS_FILE: ${{ runner.temp }}/generated-complete-sitemap-paths.nul
        run: |
          python .github/scripts/complete_sitemap_generator.py verify-git \
            --root "$GITHUB_WORKSPACE" \
            --paths-file "$GENERATED_PATHS_FILE" \
            --state unstaged

      - name: Stage only generated output
        if: steps.generate.outputs.changed == 'true'
        env:
          GENERATED_PATHS_FILE: ${{ runner.temp }}/generated-complete-sitemap-paths.nul
        run: |
          git add --pathspec-from-file="$GENERATED_PATHS_FILE" --pathspec-file-nul
          git diff --cached --check

      - name: Verify exact staged boundary
        if: steps.generate.outputs.changed == 'true'
        env:
          GENERATED_PATHS_FILE: ${{ runner.temp }}/generated-complete-sitemap-paths.nul
        run: |
          python .github/scripts/complete_sitemap_generator.py verify-git \
            --root "$GITHUB_WORKSPACE" \
            --paths-file "$GENERATED_PATHS_FILE" \
            --state staged

      - name: Commit and push verified output
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report idempotent no-op
        if: steps.generate.outputs.changed != 'true'
        run: echo "Complete sitemap already matches tracked HTML; no commit was created."
