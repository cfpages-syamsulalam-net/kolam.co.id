name: Remove Visible Crossorigin Defect

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-crossorigin-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heal-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"

      - name: Run engine regression tests
        run: python .github/scripts/test_remove_visible_crossorigin.py

      - name: Execute Crossorigin Healing Engine
        run: |
          python .github/scripts/remove_visible_crossorigin.py --root "$GITHUB_WORKSPACE"

      - name: Commit and push exact changes
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          find . -type f -name "*.html" -exec git add {} +
          if git diff --cached --quiet; then
            echo "No HTML files needed repair. Working tree clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(html): restore missing <head> tag and remove visible stray crossorigin script artifacts"
          git push origin "HEAD:${TARGET_REF}"
